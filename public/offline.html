<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#327d53">
    <title>Offline | SimpleShop</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; min-height: 100vh; display: grid; place-items: center; background: #f9faf7; color: #25312c; font: 1rem/1.6 system-ui, sans-serif; }
      main { width: min(100%, 34rem); padding: clamp(1rem, 5vw, 2.5rem); background: white; border: 1px solid #d9e2da; border-radius: 1rem; }
      h1 { line-height: 1.2; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; }
      button, a { background: #327d53; color: white; padding: 12px 16px; border-radius: 8px; border: 0; font: inherit; text-decoration: none; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>SimpleShop</span>
      <h1>This page is unavailable offline</h1>
      <p>Reconnect to open this page. You can still browse products saved on this device.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Retry Connection</button>
        <a href="/products">Browse saved products</a>
      </div>
    </main>
  </body>
</html>
